# Local stack.
#   Database only (use with `npm run dev`):   docker compose up -d mongo
#   Database + production build of the app:   docker compose --profile app up -d --build
services:
  mongo:
    image: mongo:7
    container_name: mj-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mjadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017" # reachable from this machine only
    volumes:
      - mj-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["app"]
    build: .
    container_name: mj-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-mjadmin}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-mjdeveloper}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  mj-mongo-data:
